devices:

  # ── CO5300 QSPI AMOLED 466×466 ──────────────────────────────────────────────
  # The CO5300 is a QSPI round-display driver.  Board Manager's display_lcd
  # type is used with sub_type spi; the actual 4-wire QSPI initialisation and
  # panel factory are implemented in setup_device.c.
  - name: display_lcd
    type: display_lcd
    sub_type: spi
    chip: co5300
    # init_skip: true             # Full init delegated to setup_device.c factory
    init_skip: false
    dependencies:
      espressif/esp_lcd_co5300: ">=1.0.0"
    config:
      width: 466
      height: 466
      x_max: 466
      y_max: 466
      io_spi_config:
        cs_gpio_num: 12         # GPIO12 — LCD CS (confirmed)
        dc_gpio_num: -1         # CO5300 QSPI has no separate D/C line;
                                # command/data distinguished by instruction byte
        pclk_hz: 80000000       # updated from 40000000
        lcd_cmd_bits: 32        # explicitly added
        lcd_param_bits: 8       # explicitly added
        flags:
            quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 39      # GPIO39 — LCD RESET (confirmed)
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16

    peripherals:
      - name: spi_lcd_qspi      # QSPI bus declared in board_peripherals.yaml

  # ── CST9217 capacitive touch (I2C) ──────────────────────────────────────────
  # The CST9217 is register-compatible with the CST816s family.
  # Use the espressif/esp_lcd_touch_cst816s driver as a starting point.
  - name: lcd_touch
    type: lcd_touch_i2c
    chip: cst9217
    dependencies:
      waveshare/esp_lcd_touch_cst9217: ">=1.0.0"
    config:
      io_i2c_config:
        dev_addr: 0x5A          # CST9217 default I2C address (0x15 per datasheet)
        control_phase_bytes: 1
        lcd_cmd_bits: 8         
        dc_bit_offset: 0
        flags:
          disable_control_phase: true
        peripherals:
          - name: i2c_master

      touch_config:
        x_max: 466
        y_max: 466
        rst_gpio_num: 40        # GPIO40 — TP RESET (confirmed)
        int_gpio_num: 11        # GPIO11 — TP INT  (confirmed)
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false

  # ── ES8311 audio DAC — speaker output ───────────────────────────────────────
  # ES8311 confirmed from schematic column header.
  # PA amplifier enable: GPIO46 (active HIGH — check ES8311 eval board convention)
  - name: audio_dac
    chip: es8311
    type: audio_codec
    config:
      adc_enabled: false
      dac_enabled: true
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        active_level: 1         # HIGH enables the speaker PA
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30          # 0x18 << 1 — I2C_If expects 8-bit address
        frequency: 400000

  # ── ES8311 audio ADC / ES7210 echo-cancelled mic input ──────────────────────
  # The ES7210 handles dual-mic capture with hardware AEC and feeds
  # the processed PCM to ESP32 on the shared I2S bus (GPIO8 = DSDIN).
  # Board Manager models this as an audio_codec ADC device using the same
  # I2C control bus; the ES7210 I2C address differs from the ES8311.
  - name: audio_adc
    chip: es7210
    type: audio_codec
    config:
      adc_enabled: true
      dac_enabled: false
  # Single Channel     
      # adc_max_channel: 1
      # adc_channel_mask: "1"
      # adc_channel_labels: ['MIC1']
  # Dual Channel
      # adc_max_channel: 2
      # adc_channel_mask: "11"
      # adc_channel_labels: ['MIC2', 'MIC1']
  # Four Channel - 3 MIC
      adc_channel_mask: "0111"
      adc_max_channel: 4
      adc_channel_labels: ['NA', 'MIC3', 'MIC2', 'MIC1']
      adc_init_gain: 30      
    peripherals:
      - name: i2s_audio_in     #same port, full-duplex
      - name: i2c_master
        address: 0x80          # 0x40 << 1 — I2C_If expects 8-bit address
        frequency: 400000

  # ── BOOT button ─────────────────────────────────────────────────────────────
  - name: boot_button
    type: button
    sub_type: gpio
    config:
      active_level: 0           # Low when pressed (GPIO0 pulled to GND)
    peripherals:
      - name: gpio_boot_button

  # ── SD Card ─────────────────────────────────────────────────────────────
  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 10
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 41
    peripherals:
      - name: spi_sd